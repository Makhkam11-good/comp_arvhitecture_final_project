<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShopApp</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">S</div>
            <div>
                <h1>ShopApp</h1>
                <p>Интернет-магазин</p>
            </div>
        </div>
        <nav class="nav">
            <button class="nav-btn active" data-view="catalog">Каталог</button>
            <button class="nav-btn" data-view="orders">Заказы</button>
            <button class="nav-btn" data-view="admin">Админ</button>
        </nav>
        <div class="account">
            <span id="userBadge" class="user-badge">Гость</span>
            <button id="authToggle" class="secondary-btn">Войти</button>
        </div>
    </header>

    <main class="layout">
        <aside class="sidebar">
            <section class="panel">
                <h2>Категории</h2>
                <div id="categoryList" class="category-list"></div>
            </section>

            <section class="panel">
                <h2>Корзина</h2>
                <div id="cartList" class="cart-list"></div>
                <div class="cart-total">
                    <span>Итого</span>
                    <strong id="cartTotal">$0.00</strong>
                </div>
                <input id="orderAddress" class="field" placeholder="Адрес доставки">
                <button id="checkoutBtn" class="primary-btn full">Оформить заказ</button>
            </section>
        </aside>

        <section class="content">
            <section id="catalogView" class="view active">
                <div class="toolbar">
                    <div>
                        <h2>Товары</h2>
                        <p id="catalogMeta">Загрузка каталога</p>
                    </div>
                    <div class="search-row">
                        <input id="searchInput" class="field" placeholder="Поиск товара">
                        <button id="searchBtn" class="secondary-btn">Найти</button>
                        <button id="resetSearchBtn" class="ghost-btn">Сброс</button>
                    </div>
                </div>
                <div id="productGrid" class="product-grid"></div>
                <div class="pager">
                    <button id="prevPageBtn" class="secondary-btn">Назад</button>
                    <span id="pageInfo">Страница 1</span>
                    <button id="nextPageBtn" class="secondary-btn">Вперед</button>
                </div>
            </section>

            <section id="ordersView" class="view">
                <div class="toolbar">
                    <div>
                        <h2>Мои заказы</h2>
                        <p>История покупок текущего пользователя</p>
                    </div>
                    <button id="refreshOrdersBtn" class="secondary-btn">Обновить</button>
                </div>
                <div id="ordersList" class="stack-list"></div>
            </section>

            <section id="adminView" class="view">
                <div class="toolbar">
                    <div>
                        <h2>Панель администратора</h2>
                        <p>Создание категорий и товаров</p>
                    </div>
                </div>
                <div class="admin-grid">
                    <form id="categoryForm" class="panel form-panel">
                        <h3>Новая категория</h3>
                        <input name="name" class="field" placeholder="Название" required maxlength="100">
                        <textarea name="description" class="field" placeholder="Описание"></textarea>
                        <button class="primary-btn full" type="submit">Создать категорию</button>
                    </form>

                    <form id="productForm" class="panel form-panel">
                        <h3>Новый товар</h3>
                        <input name="name" class="field" placeholder="Название" required maxlength="200">
                        <textarea name="description" class="field" placeholder="Описание"></textarea>
                        <div class="two-cols">
                            <input name="price" class="field" placeholder="Цена" type="number" min="0.01" step="0.01" required>
                            <input name="stock" class="field" placeholder="Остаток" type="number" min="0" required>
                        </div>
                        <input name="imageUrl" class="field" placeholder="Ссылка на изображение">
                        <select name="categoryId" id="productCategorySelect" class="field" required></select>
                        <button class="primary-btn full" type="submit">Создать товар</button>
                    </form>
                </div>
            </section>
        </section>
    </main>

    <dialog id="authDialog" class="dialog">
        <form id="authForm" class="dialog-card">
            <div class="dialog-head">
                <h2 id="authTitle">Вход</h2>
                <button type="button" id="closeAuthBtn" class="icon-btn">x</button>
            </div>
            <input name="username" class="field" placeholder="Логин" required>
            <input name="email" class="field register-only hidden" placeholder="Email">
            <input name="password" class="field" type="password" placeholder="Пароль" required minlength="6">
            <button class="primary-btn full" type="submit">Продолжить</button>
            <button id="switchAuthModeBtn" type="button" class="ghost-btn full">Создать аккаунт</button>
        </form>
    </dialog>

    <dialog id="productDialog" class="dialog">
        <article class="dialog-card wide">
            <div class="dialog-head">
                <h2 id="productDialogTitle">Товар</h2>
                <button type="button" id="closeProductBtn" class="icon-btn">x</button>
            </div>
            <div id="productDetails" class="product-details"></div>
        </article>
    </dialog>

    <div id="toast" class="toast"></div>
    <script src="/app.js"></script>
</body>
</html>
